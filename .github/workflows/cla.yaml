name: "CLA Assistant"
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened,closed,synchronize]

permissions:
  actions: write
  contents: write  # this can be 'read' if the signatures are in a remote repo
  pull-requests: write
  statuses: write

jobs:
  CLAssistant:
    runs-on: ubuntu-latest
    steps:
      - name: "CLA Assistant"
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: cla-assistant/github-action@v2.1.3-beta
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # the below token should have repo scope and must be manually added by you in the repository's secret
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          path-to-document: 'https://github.com/acmestack/.github/blob/main/AcmeStack-CLA.md' # e.g. a CLA or a DCO document
          # branch should not be protected
          branch: 'cla'
          allowlist: bot*,*[bot],dependabot[bot],github-actions[bot]
          lock-pullrequest-aftermerge: false
          remote-organization-name: acmestack
          remote-repository-name: gpi
          custom-notsigned-prcomment: |
            :wave: Thanks for your contribution to AcmeStack!

            Please read and sign our [Contributor License Agreement](https://acmestack.com/docs/contributing/contributor-license-agreement/) to enable your pull request to be merged.

            Reply the following message to sign the CLA:
            > I have read the CLA Document and I hereby sign the CLA
