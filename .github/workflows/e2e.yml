name: E2E

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  kubernetes:
    name: K8s e2e (v${{ matrix.k8s }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {k8s: "1.36.1", kubectl: "v1.36.1"}
          - {k8s: "1.35.5", kubectl: "v1.35.6"}
          - {k8s: "1.34.8", kubectl: "v1.34.9"}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build gpi base image (gpilet + Ray, cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.gpi-base
          load: true
          tags: ghcr.io/acmestack/gpi-base:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create kind cluster (Kubernetes ${{ matrix.k8s }})
        uses: helm/kind-action@v1
        with:
          version: v0.32.0
          node_image: kindest/node:v${{ matrix.k8s }}
          cluster_name: gpi-e2e-${{ matrix.k8s }}
          kubectl_version: ${{ matrix.kubectl }}

      - name: Load gpi base image into kind
        run: kind load docker-image --name gpi-e2e-${{ matrix.k8s }} ghcr.io/acmestack/gpi-base:latest

      - name: Run Kubernetes e2e tests
        run: make e2e
        env:
          KUBECONFIG: /home/runner/.kube/config
