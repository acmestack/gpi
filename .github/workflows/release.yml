name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - {os: linux, arch: amd64}
          - {os: linux, arch: arm64}
          - {os: darwin, arch: amd64}
          - {os: darwin, arch: arm64}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: |
          SUFFIX="${{ matrix.target.os }}-${{ matrix.target.arch }}"
          VERSION="${GITHUB_REF_NAME#v}"
          GOOS=${{ matrix.target.os }} GOARCH=${{ matrix.target.arch }} CGO_ENABLED=0 \
            go build -ldflags "-s -w -X github.com/acmestack/gpi/internal/buildinfo.Version=$VERSION" -o gpi-$SUFFIX ./cmd/gpi
          GOOS=${{ matrix.target.os }} GOARCH=${{ matrix.target.arch }} CGO_ENABLED=0 \
            go build -ldflags "-s -w -X github.com/acmestack/gpi/internal/buildinfo.Version=$VERSION" -o gpilet-$SUFFIX ./cmd/gpilet

      - name: Compress
        run: |
          tar -czf gpi-${{ matrix.target.os }}-${{ matrix.target.arch }}.tar.gz \
            --exclude='*.tar.gz' --exclude='*.zip' \
            gpi-* gpilet-*

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: gpi-${{ matrix.target.os }}-${{ matrix.target.arch }}.tar.gz
          body_path: .github/RELEASE_NOTES.md

  docker:
    name: Publish Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/gpi:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/gpi:latest
