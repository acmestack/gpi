name: with-credentials
num_nodes: 1

resources:
  accelerators: A100:1
  cpus: 8+
  memory: 32+

# Optional per-task cloud access keys.
# If provided here they are used for this task's launch (and later down/stop/start);
# otherwise gpi falls back to env vars / local disk credentials.
credentials:
  aws:
    access_key_id: AKIA...
    secret_access_key: ...
    region: us-east-1
  aliyun:
    access_key_id: LTAI...
    access_key_secret: ...

setup: |
  pip install -r requirements.txt

run: |
  python train.py