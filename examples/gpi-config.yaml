# gpi user configuration (mirrors SkyPilot's ~/.sky/config.yaml).
# Copy to $GPI_HOME/config.yaml (default ~/.gpi/config.yaml), or .gpi.yaml in a
# project directory for project-level settings that layer over the user file.
#
# Precedence: CLI flag > task YAML > this config file > built-in defaults.

# --- Cloud network reuse -----------------------------------------------
# When set, providers reuse your existing cloud network resources instead of
# auto-creating new ones. Unset entries fall back to the built-in logic
# (default VPC, auto-created security group, ...).

aws:
  # VPCs to prefer, matched by Name tag or id (first existing match wins).
  vpc_names: [prod-vpc]
  # Subnets to prefer, matched by Name tag or id (in listed order).
  subnet_names: [ml-subnet]
  # Reuse this security group (by name or id) instead of creating "gpi-sg".
  security_group_name: gpi-allow-all

aliyun:
  # VPC id to reuse.
  vpc_id: vpc-bp1xxxx
  # Vswitch ids to reuse (in listed order).
  vswitch_ids: [vsw-bp1yyy, vsw-bp1zzz]
  # Security group id to reuse instead of creating one.
  security_group_id: sg-bp1www

kubernetes:
  # Kubeconfig context used when the task does not pin a region (default: the
  # current kubeconfig context).
  context: kind-gpi
  # Namespace where gpi node pods are created (default "default").
  namespace: ml
  # Container image used for node pods. Defaults to the prebuilt gpi base image
  # (gpilet + Ray, see Dockerfile.gpi-base). Use a custom image when you need
  # extra dependencies pre-installed on every node.
  image: ghcr.io/acmestack/gpi-base:latest
  # gpilet runtime knobs (see gpilet serve --help).
  gpilet_dir: /var/lib/gpilet
  gpilet_interval: 10
  # Ray cluster ports.
  ray_head_port: 6379
  ray_dashboard_port: 8265
  # Node readiness wait: RunInstances waits up to pod_wait_timeout seconds per
  # attempt (image pull + container start can be slow on first run), retrying
  # pod_wait_retries times before failing the launch.
  pod_wait_timeout: 120
  pod_wait_retries: 3

# --- Global defaults (used when the CLI flag is not explicitly passed) ---

# Default cloud filter for gpi launch/optimize (comma-separated).
allowed_clouds: [aws, aliyun]
# Default region / zone.
region: us-east-1
zone: us-east-1a
# Default spot preference (--spot overrides).
use_spot: false

# --- Logging ------------------------------------------------------------
# Logs go to stdout by default (zap text format at info level). Set `file`
# to enable file output with size-based rotation, gzip compression and
# backup retention (via lumberjack). Precedence: CLI flag > config file >
# env var (GPI_LOG_LEVEL / GPI_LOG_FILE / GPI_LOG_FORMAT) > default.
logging:
  level: info      # debug | info | warn | error
  format: text     # text | json
  # file: /var/log/gpi/gpi.log   # empty = stdout
  # max_size: 100    # MB before rotating (default 100)
  # max_backups: 5   # rotated files kept (default 5)
  # max_age: 30      # days to keep rotated files (default 30)
  # compress: true   # gzip rotated files (default true)
